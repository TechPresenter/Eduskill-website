; =============================================================================
;  PHP upload limits for the application directory
; -----------------------------------------------------------------------------
;  The production site runs nginx + PHP-FPM, so .htaccess is ignored entirely
;  and php_value directives in it do nothing. .user.ini is the mechanism
;  PHP-FPM/CGI reads for PHP_INI_PERDIR settings, which is what these are.
;  Under Apache/mod_php (the local XAMPP box) this file is ignored instead and
;  the .htaccess/php.ini values apply — either way, nothing breaks.
;
;  WHY THIS FILE EXISTS
;  --------------------
;  The server was running the stock PHP defaults:
;
;      upload_max_filesize = 2M
;      post_max_size       = 8M
;
;  while /coordinator-apply offers ten document slots and advertised 5 MB each.
;  Two consequences, both of which broke the form in production:
;
;    * an ordinary phone photograph (3-4 MB) was refused as "The file is too
;      large" even though the page said 5 MB was fine;
;    * a few documents together exceeded post_max_size, and PHP's behaviour
;      there is to DISCARD THE WHOLE REQUEST BODY silently — the handler then
;      sees an empty $_POST and tells an applicant who filled in every field
;      that their name, email and phone are missing. Nothing is ever inserted,
;      which is why no application reached the admin panel.
;
;  max_file_uploads must stay comfortably above the ten checklist slots, or the
;  files past the limit are dropped with no error at all.
;
;  NOTE — the web server has its own body limit in front of PHP. If nginx's
;  client_max_body_size is below post_max_size, nginx rejects the request with
;  its own 413 before PHP ever sees it. Raise it in the vhost to match:
;
;      client_max_body_size 48M;
;
;  The application no longer depends on any of this being correct: the form
;  reads the effective limits at runtime (upload_limit_bytes() and
;  post_attachment_budget() in includes/upload.php), shows them to the
;  applicant, shrinks oversized photographs in the browser, and refuses
;  anything still too big before it is sent. These values raise the ceiling;
;  they are not what keeps the form working.
; =============================================================================

upload_max_filesize = 8M
post_max_size = 48M
max_file_uploads = 30

; Ten documents over a slow rural connection must not be cut off part-way.
; This governs how long PHP will spend READING the request; it is separate from
; max_execution_time, which does not count upload time.
max_input_time = 120
